name: Mobil uygulamalar

# index.html ya da mobil kabuk değişince Android ve iOS sürümlerini yeniden derler.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon-192.png'
      - 'apple-touch-icon.png'
      - 'mobil/**'
      - 'masaustu/**'
      - '.github/workflows/mobil.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobil
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: masaustu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node hazirla.mjs
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows -y --cleanup-tag || true
          gh release create windows "dist/Kasa-Defteri-Kurulum.exe" --title "Kasa Defteri - Windows" --notes "Bilgisayara kurulum dosyası. İndirip çift tıklayın."

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Kabuğu hazırla
        run: |
          npm install --no-audit --no-fund
          node hazirla.mjs
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1d1b17' --iconBackgroundColorDark '#1d1b17' --splashBackgroundColor '#f4f1ea' --splashBackgroundColorDark '#f4f1ea'
          # Dekont için kamera izni
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          # Her derlemede sürüm numarası artsın (güncelleme yüklenebilsin)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: İmza anahtarı (varsa)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/kasa.keystore
            cat >> android/app/build.gradle <<EOF
          android {
              signingConfigs {
                  kasa {
                      storeFile file('kasa.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'kasa'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.kasa }
                  release { signingConfig signingConfigs.kasa }
              }
          }
          EOF
            echo "IMZALI=1" >> $GITHUB_ENV
          fi
      - name: Derle
        working-directory: mobil/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$IMZALI" = "1" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../../Kasa-Defteri.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../Kasa-Defteri.apk
          fi
      - name: İndirme bağlantısını güncelle
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android -y --cleanup-tag || true
          gh release create android Kasa-Defteri.apk \
            --title "Kasa Defteri Android (1.0.${{ github.run_number }})" \
            --notes "Android telefona kurmak için Kasa-Defteri.apk dosyasını indirip açın." \
            --latest

  ios:
    name: iOS TestFlight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobil
    env:
      TEAM_ID: P626DF82DK
      ASC_KEY_ID: 98B9Q79RJY
      ASC_ISSUER_ID: dc17aa1a-aa9c-4ac5-af67-d5f2bd8f5fbd
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Apple anahtarları var mı?
        working-directory: .
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Apple anahtarları henüz eklenmedi, iOS derlemesi atlanıyor."
            echo "ATLA=1" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
        if: env.ATLA != '1'
      - uses: actions/setup-node@v4
        if: env.ATLA != '1'
        with:
          node-version: 22
      - name: Kabuğu hazırla
        if: env.ATLA != '1'
        run: |
          npm install --no-audit --no-fund
          node hazirla.mjs
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#1d1b17' --iconBackgroundColorDark '#1d1b17' --splashBackgroundColor '#f4f1ea' --splashBackgroundColorDark '#f4f1ea'
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Dekont fotoğrafı çekmek için kamera kullanılır.'" $P
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Dekont eklemek için fotoğraflarınızdan seçim yapılır.'" $P
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P
          npx cap sync ios
      - name: Apple anahtarını dene
        if: env.ATLA != '1'
        run: node asc-kontrol.mjs
      - name: Derle ve TestFlight'a yükle
        if: env.ATLA != '1'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            $AUTH DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
          rm -f "$KEY"
# iOS anahtarı eklendi: 2026-11-24
